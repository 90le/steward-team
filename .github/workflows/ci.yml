name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown-lint:
    name: Lint (Markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2@0.13.0 "**/*.md" "#node_modules"

  structure-test:
    name: Test (Structure & Links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run structure test
        run: bash scripts/test-structure.sh
